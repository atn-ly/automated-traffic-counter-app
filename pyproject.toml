[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osba-traffic-counter"
version = "0.48.20"
description = "Desktop workflow for reviewing and exporting multimodal traffic counts."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PySide6>=6.8,<7",
    "opencv-python>=4.10,<5",
    "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
vision = [
    "ultralytics>=8.4.104,<9",
    "lap>=0.5.12,<1",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
traffic-counter = "traffic_reviewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_reviewer = ["*.yaml", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
